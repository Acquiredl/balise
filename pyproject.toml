[project]
name = "balise"
version = "0.1.0"
description = "Law 25 compliance-readiness assessor for Quebec SMBs - bilingual reports with a legible audit trail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
semantic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
balise = "balise.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pinned so local runs and CI agree regardless of machine-level ruff config.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# UP042 wants StrEnum; the (str, Enum) registry spine works identically and
# is not worth churning for a lint aesthetic.
ignore = ["UP042"]
