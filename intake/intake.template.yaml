  B1:
    question_fr: >-
      Tenez-vous un registre des incidents de confidentialité (8 éléments
      prescrits, conservation 5 ans) et avez-vous un processus de réponse?
      (Norme légale: notification « avec diligence » — il n'existe PAS de
      délai de 72 heures au Québec.)
    question_en: >-
      Do you keep a confidentiality-incident register (8 prescribed elements,
      5-year retention) and have a response process? (Legal standard:
      notify "with diligence" — there is NO 72-hour deadline in Quebec.)
    answer: unknown
    details: ""
  B2:
    question_fr: >-
      Réalisez-vous une ÉFVP pour tout projet d'acquisition, de développement
      ou de refonte de système d'information ou de prestation électronique de
      services impliquant des renseignements personnels — et ces projets
      garantissent-ils que les RP recueillis puissent être communiqués dans un
      format technologique structuré et couramment utilisé (art. 3.3, al. 3)?
    question_en: >-
      Do you conduct a PIA for any project to acquire, develop or overhaul an
      information system or electronic service delivery system involving
      personal information — and do those projects ensure collected PI can be
      output in a structured, commonly used technological format (s. 3.3
      para. 3, portability-by-design)?
    answer: unknown
    details: ""
