enterprise:
  name: ""
  website: ""
  employees: 0
  sector: ""
  sells_outside_quebec: unknown   # PIPEDA dual-regime flag

answers:
  B1:
    question_fr: >-
      Tenez-vous un registre des incidents de confidentialité (8 éléments
      prescrits, conservation 5 ans) et avez-vous un processus de réponse?
      (Norme légale: notification « avec diligence » — il n'existe PAS de
      délai de 72 heures au Québec.)
    question_en: >-
      Do you keep a confidentiality-incident register (8 prescribed elements,
      5-year retention) and have a response process? (Legal standard:
      notify "with diligence" — there is NO 72-hour deadline in Quebec.)
    answer: unknown
    details: ""
  B2:
    question_fr: >-
      Réalisez-vous une ÉFVP pour tout projet d'acquisition, de développement
      ou de refonte de système d'information ou de prestation électronique de
      services impliquant des renseignements personnels — et ces projets
      garantissent-ils que les RP recueillis puissent être communiqués dans un
      format technologique structuré et couramment utilisé (art. 3.3, al. 3)?
    question_en: >-
      Do you conduct a PIA for any project to acquire, develop or overhaul an
      information system or electronic service delivery system involving
      personal information — and do those projects ensure collected PI can be
      output in a structured, commonly used technological format (s. 3.3
      para. 3, portability-by-design)?
    answer: unknown
    details: ""
  B3:
    question_fr: >-
      Pour chaque communication de RP hors Québec (incluant chaque fournisseur
      SaaS hébergé aux États-Unis), avez-vous une ÉFVP et une entente écrite?
    question_en: >-
      For each communication of PI outside Quebec (including every US-hosted
      SaaS vendor), do you have a PIA and a written agreement?
    answer: unknown
    details: ""
  B4:
    question_fr: >-
      Vos contrats avec mandataires et fournisseurs sont-ils écrits et
      prévoient-ils : mesures de confidentialité, usage limité au mandat,
      aucune conservation après l'échéance, notification sans délai des
      violations (même tentées) au responsable, et droit de vérification
      (art. 18.3)?
    question_en: >-
      Are your mandatary/vendor contracts in writing and do they provide:
      confidentiality measures, use limited to the mandate, no retention
      after expiry, without-delay notification of violations (even attempted)
      to your privacy officer, and verification rights (s. 18.3)?
    answer: unknown
    details: ""
  B5:
    question_fr: >-
      Avez-vous des politiques internes couvrant les rôles du cycle de vie des
      RP, la conservation/destruction et le traitement des plaintes?
    question_en: >-
      Do you have internal policies covering PI lifecycle roles,
      retention/destruction, and complaint handling?
    answer: unknown
    details: ""
  B6:
    question_fr: >-
      Utilisez-vous des systèmes biométriques (horodateurs à empreinte,
      reconnaissance faciale)? Si oui: consentement exprès obtenu, la
      pratique de vérification elle-même divulguée à la CAI, banque de
      données déclarée 60 jours avant la mise en service, minimisation
      stricte, et destruction des enregistrements dès que la fin est
      accomplie (LCCJTI, art. 44-45)?
    question_en: >-
      Do you use biometric systems (fingerprint time-clocks, facial
      recognition)? If so: express consent obtained, the verification
      practice itself disclosed to the CAI, the database declared 60 days
      before service, strict minimization, and records destroyed as soon as
      the purpose is met (LCCJTI, ss. 44-45)?
    answer: unknown
    details: ""
  B7:
    question_fr: >-
      Prenez-vous des décisions fondées exclusivement sur un traitement
      automatisé de RP? Si oui: information de la personne et possibilité de
      présenter des observations?
    question_en: >-
      Do you make decisions based exclusively on automated processing of PI?
      If so: is the person informed and able to submit observations?
    answer: unknown
    details: ""
  B8:
    question_fr: >-
      Recueillez-vous des RP de mineurs de moins de 14 ans? Si oui:
      consentement du titulaire de l'autorité parentale?
    question_en: >-
      Do you collect PI from minors under 14? If so: consent of the holder
      of parental authority?
    answer: unknown
    details: ""
  B9:
    question_fr: >-
      Pouvez-vous répondre à une demande de portabilité (format technologique
      structuré et couramment utilisé)?
    question_en: >-
      Can you fulfil a data-portability request (structured, commonly used
      technological format)?
    answer: unknown
    details: ""
  B10:
    question_fr: >-
      Traitez-vous des renseignements sensibles (santé, biométrie, autrement
      intimes)? Si oui: consentement exprès pour utilisation/communication?
    question_en: >-
      Do you handle sensitive information (health, biometric, otherwise
      intimate)? If so: express consent for use/communication?
    answer: unknown
    details: ""
  B11:
    question_fr: >-
      Votre personnel reçoit-il une formation/sensibilisation à la protection
      des RP? (Attente de la CAI — non exigée explicitement par la loi.)
    question_en: >-
      Does your staff receive privacy training/awareness? (CAI expectation —
      not an explicit statutory mandate.)
    answer: unknown
    details: ""
  B12:
    question_fr: >-
      Avez-vous des mesures de sécurité proportionnées à la sensibilité, à la
      finalité, à la quantité, à la répartition et au support des RP (art. 10)?
    question_en: >-
      Do you have security measures proportionate to the sensitivity, purpose,
      quantity, distribution and medium of the PI you hold (s. 10)?
    answer: unknown
    details: ""
  B13:
    question_fr: >-
      Les RP utilisés pour prendre une décision au sujet d'une personne
      sont-ils exacts et à jour au moment de la décision, et conservés au
      moins 1 an après celle-ci (art. 11)?
    question_en: >-
      Is PI used to make a decision about a person accurate and up to date at
      decision time, and kept at least 1 year after the decision (s. 11)?
    answer: unknown
    details: ""
  B14:
    question_fr: >-
      Lorsque les fins sont accomplies, détruisez-vous les RP ou les
      anonymisez-vous selon les critères réglementaires (art. 23)?
    question_en: >-
      Once purposes are achieved, do you destroy PI or anonymize it to
      regulation-grade criteria (s. 23)?
    answer: unknown
    details: ""
  B15:
    question_fr: >-
      Vos communications de prospection reposent-elles sur un consentement
      (la prospection n'est jamais une « fin compatible », art. 12), avec
      identification de l'entreprise et retrait honoré (art. 22)?
    question_en: >-
      Is your marketing/prospection based on consent (prospection is never a
      'consistent purpose', s. 12), with self-identification and honored
      withdrawal (s. 22)?
    answer: unknown
    details: ""
  B16:
    question_fr: >-
      Traitez-vous les demandes d'accès et de rectification par écrit dans un
      délai maximal de 30 jours, sans frais d'accès, avec refus motivés
      indiquant recours et délais (art. 27 à 34)? (Le silence vaut refus.)
    question_en: >-
      Do you handle access/rectification requests in writing within 30 days
      maximum, free of charge, with reasoned refusals citing remedies and
      deadlines (ss. 27-34)? (Silence is deemed refusal.)
    answer: unknown
    details: ""
